name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate PowerShell Scripts Syntax
      shell: pwsh
      run: |
        Get-ChildItem -Path scripts/*.ps1 | ForEach-Object {
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) {
            throw "Syntax error in $($_.Name): $($errs | Out-String)"
          }
          Write-Host "Verified $($_.Name)" -ForegroundColor Green
        }

    - name: Run Unit Tests
      shell: pwsh
      run: |
        $env:PYTHONPATH = "."
        python -m pytest tests/test_b_gateway.py tests/test_c_tool_calling.py tests/test_d_agent_zero.py tests/test_e_security.py tests/test_f_installation.py -v
